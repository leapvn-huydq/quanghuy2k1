# Standalone-template workflow: GitHub only recognizes .github/workflows/ at the repository root.
# If this project is extracted to its own repo, this workflow becomes active.
name: QA Portfolio - API and Browser Regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-regression:
    name: API and business rules (Node.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax
        run: npm run lint
      - name: Run API and domain regression
        run: npm run test:report
      - name: Upload API reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-evidence
          path: reports/last-run.*
          if-no-files-found: warn
          retention-days: 14

  browser-regression:
    name: Playwright UI smoke (synthetic local app)
    # Stay on the Playwright 1.60.0-supported Ubuntu image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI smoke tests
        run: npm run test:ui
        env:
          CI: 'true'
